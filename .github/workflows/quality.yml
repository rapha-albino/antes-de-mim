name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tracked-file whitespace
        run: git diff --check HEAD^ HEAD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install browser for navigation tests
        run: npx playwright install --with-deps chromium

      - name: Test navigation and accessibility
        run: npm run test:e2e

      - name: Check project documentation
        run: test -s README.md
